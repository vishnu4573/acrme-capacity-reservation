# Baseline v4.0; SKU/approval extension recorded in Requirements/acrme_sku_financial_approval_baseline_change.md.
capacity_request_policy:
  effective_date: "2026-10-23"
  deployment_scope:
    virtual_machines: true
    virtual_machine_scale_sets:
      enabled: true
      usage: aks_cluster_node_pools
    shared_series_allowlist_and_approval_policy: true
  allowed_vm_series:
    matching: exact_series_membership
    size_scope: all_sizes_within_listed_series
    unlisted_series: not_allowed_for_new_capacity_requests
    series:
      - Standard_Ddv5
      - Standard_Ddsv5
      - Standard_Dasv5
      - Standard_Dadsv5
      - Standard_Dsv6
      - Standard_Ddsv6
      - Standard_Dldv6
      - Standard_Dldsv6
      - Standard_Dalsv6
      - Standard_Daldsv6
      - Standard_Dsv7
      - Standard_Ddsv7
      - Standard_Dldv7
      - Standard_Dldsv7
      - Standard_Dalsv7
      - Standard_Daldsv7
      - Standard_Edv5
      - Standard_Edsv5
      - Standard_Easv5
      - Standard_Eadsv5
      - Standard_Esv6
      - Standard_Edsv6
      - Standard_Easv6
      - Standard_Eadsv6
      - Standard_Esv7
      - Standard_Edsv7
      - Standard_Easv7
      - Standard_Eadsv7
      - Standard_Lsv3
      - Standard_Lasv4
      - Standard_Lsv4
  approval:
    scope: new_capacity_requests
    system: Jira
    required_approvals:
      - business
      - finance
    approval_requirement: all_required
    evidence: jira_request_and_both_approval_records
    existing_protective_reconciliation: unchanged
  # Policy eligibility does not establish platform support or deployment readiness.
  deployment_validation:
    exact_vm_size_required: true
    region_zone_and_subscription_eligibility_required: true
    reservation_support_required_when_enforced: true
    capacity_and_both_quota_caps_required: true
  # Workflow details are not inferred from the family allowlist.
  pending_decisions:
    - jira_workflow_and_approver_roles
    - approval_quantity_scope_validity_and_change_rules
    - exact_vm_size_to_series_mapping
    - preview_vm_series_production_policy

compute_subscription_policies:
  standard:
    cluster_capacity:
      max_total_clusters: 16
      max_active_clusters: 8
      blue_cluster_slots: 8
      green_cluster_slots: 8
    deployment:
      model: blue_green
      purpose: reduce_version_and_hotfix_rollout_downtime
      normal_active_color: blue
      rollout_replacement_color: green
      green_slot_purpose: rollout_headroom_not_additional_steady_state_capacity
      rollout:
        keep_current_clusters_serving_during_replacement_deployment: true
        validate_replacement_before_traffic_cutover: true
        capacity_check: current_and_replacement_overlap
      # Promotion naming and rollback retention have not been agreed.
      post_cutover_color_convention: pending_decision
      rollback_retention_policy: pending_decision
    dr_clusters:
      provision: only_during_dr
      capacity_source: blue_or_green_cluster_slots
      counts_toward_total_limit: true
      # Slot availability alone cannot authorize consuming rollout headroom.
      rollout_headroom_conflict_policy: pending_decision
    when_limit_reached:
      trigger: active_cluster_limit_or_insufficient_rollout_headroom
      action: provision_another_compute_subscription
      new_subscription_policy: standard

resource_subscription_policies:
  standard:
    scale_out:
      trigger_scope: azure_subscription
      trigger: any_subscription_level_limit_reached
      action: provision_another_resource_subscription
      proactive: false
      new_subscription_policy: standard

